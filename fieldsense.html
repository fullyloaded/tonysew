<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Back to the ’80s | Morning Drive Memories</title>
    <style>
        *{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
        body,html{margin:0;padding:0;width:100%;height:100%;background:#05050d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Helvetica,Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e2e8f0}
        #game-wrapper{position:relative;width:100%;max-width:480px;height:100%;max-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#030712}
        canvas{width:100%;height:100%;display:block;background:#000}
        .touch-ui{position:absolute;bottom:22px;left:0;right:0;padding:0 18px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:15}
        .btn-group{display:flex;gap:14px;pointer-events:auto}
        .touch-btn{width:70px;height:70px;border-radius:50%;background:rgba(15,23,42,.78);border:2px solid rgba(148,163,184,.35);color:#f1f5f9;font-size:1.55rem;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .08s,background .1s,border-color .1s}
        .touch-btn:active,.touch-btn.active{transform:scale(.88);background:rgba(56,189,248,.55);border-color:#38bdf8}
        .touch-btn.nitro{background:linear-gradient(145deg,rgba(217,119,6,.88),rgba(245,158,11,.78));border-color:#fbbf24;width:80px;height:80px;font-size:1.75rem}
        .touch-btn.nitro:active,.touch-btn.nitro.active{background:rgba(251,191,36,.95);box-shadow:0 0 22px rgba(251,191,36,.55)}
        .touch-btn.brake{background:rgba(239,68,68,.55);border-color:#f87171}
        .overlay{position:absolute;inset:0;background:rgba(3,7,18,.88);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:30;backdrop-filter:blur(12px);padding:24px;text-align:center}
        .overlay h1{margin:0 0 8px;font-size:1.7rem;letter-spacing:1px}
        .overlay .subtitle{color:#94a3b8;font-size:.95rem;margin-bottom:22px}
        .overlay .stats{background:rgba(15,23,42,.75);border:1px solid rgba(56,189,248,.25);border-radius:14px;padding:14px 22px;margin-bottom:22px;min-width:240px;font-size:1.05rem}
        .btn-primary{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#0f172a;border:none;padding:14px 36px;font-size:1.15rem;font-weight:700;border-radius:30px;cursor:pointer;box-shadow:0 0 24px rgba(56,189,248,.45);margin:6px}
        .btn-primary:active{transform:scale(.96)}
        .hud-top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:12;pointer-events:none}
        .hud-panel{background:rgba(15,23,42,.7);border:1px solid rgba(148,163,184,.2);border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px);font-size:.85rem}
        .hud-panel .label{color:#94a3b8;font-size:.7rem}
        .hud-panel .value{font-weight:700;font-size:1.2rem;color:#f1f5f9}
        .speed-value{color:#38bdf8}
        .dist-value{color:#a78bfa}
        .nitro-wrap{position:absolute;top:70px;right:14px;width:110px;z-index:12;pointer-events:none}
        .nitro-bg{height:8px;background:rgba(15,23,42,.8);border-radius:4px;overflow:hidden;border:1px solid rgba(251,191,36,.3)}
        .nitro-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:4px;transition:width .1s}
        .best-score{position:absolute;top:70px;left:14px;font-size:.75rem;color:#94a3b8;z-index:12;pointer-events:none}
    </style>
</head>
<body>
<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div class="hud-top">
        <div class="hud-panel"><div class="label">時速</div><div class="value speed-value" id="hudSpeed">0</div></div>
        <div class="hud-panel" style="text-align:right"><div class="label">距離</div><div class="value dist-value" id="hudDist">0</div></div>
    </div>
    <div class="best-score" id="bestScore">最佳：0 m</div>
    <div class="nitro-wrap">
        <div style="font-size:0.65rem;color:#fbbf24;margin-bottom:2px;text-align:right">NITRO</div>
        <div class="nitro-bg"><div class="nitro-fill" id="nitroBar" style="width:100%"></div></div>
    </div>
    <div class="touch-ui" id="touchUI">
        <div class="btn-group">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="touch-btn brake" id="btn-brake">🛑</div>
            <div class="touch-btn nitro" id="btn-nitro">🔥</div>
        </div>
    </div>
    <div class="overlay" id="startOverlay" style="display:flex">
        <h1 style="background:linear-gradient(90deg,#f472b6,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Back to the ’80s</h1>
        <div class="subtitle">Morning Drive Memories</div>
        <div class="stats" style="font-size:0.9rem;color:#94a3b8;line-height:1.6">
            ◀▶ 左右移動<br>🔥 氮氣加速 · 🛑 煞車<br>避開其他車輛，跑越遠越好
        </div>
        <button class="btn-primary" id="btnStart">開始狂飆 🏎️</button>
    </div>
    <div class="overlay" id="crashOverlay">
        <h1 style="color:#f87171">事故發生！</h1>
        <div class="subtitle">再來一次吧</div>
        <div class="stats">
            <div>距離：<span id="finalDist">0</span> m</div>
            <div>得分：<span id="finalScore">0</span></div>
            <div style="margin-top:6px;color:#fbbf24">最佳：<span id="finalBest">0</span> m</div>
        </div>
        <button class="btn-primary" id="btnRestart">再次挑戰</button>
    </div>
</div>
<script>
(function(){
"use strict";
var canvas = document.getElementById("gameCanvas");
var ctx = canvas.getContext("2d");

var player = {x:0, speed:0, maxSpeed:185, accel:0.85, decel:0.28, brake:1.9, nitro:100, isNitro:false, isBraking:false};
var gameState = "menu";
var score = 0;
var distance = 0;
var best = 0;
var keys = {};
var roadOffset = 0;
var frame = 0;
var traffic = [];
var particles = [];

try {
    var saved = localStorage.getItem("fieldsense_best");
    if (saved) best = Number(saved) || 0;
} catch(e) { best = 0; }
document.getElementById("bestScore").textContent = "最佳：" + Math.floor(best) + " m";

function resizeCanvas() {
    var wrapper = document.getElementById("game-wrapper");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = wrapper.clientWidth * dpr;
    canvas.height = wrapper.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.width = wrapper.clientWidth + "px";
    canvas.style.height = wrapper.clientHeight + "px";
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

window.addEventListener("keydown", function(e) {
    keys[e.code] = true;
    if ((e.code === "Space" || e.code === "ShiftLeft") && player.nitro > 5) player.isNitro = true;
    if (e.code === "KeyS" || e.code === "ArrowDown") player.isBraking = true;
});
window.addEventListener("keyup", function(e) {
    keys[e.code] = false;
    if (e.code === "Space" || e.code === "ShiftLeft") player.isNitro = false;
    if (e.code === "KeyS" || e.code === "ArrowDown") player.isBraking = false;
});

function setupTouch(id, keyName) {
    var btn = document.getElementById(id);
    function down(e) { e.preventDefault(); keys[keyName] = true; btn.classList.add("active"); }
    function up(e) { e.preventDefault(); keys[keyName] = false; btn.classList.remove("active"); }
    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointerleave", up);
    btn.addEventListener("pointercancel", up);
}
setupTouch("btn-left", "ArrowLeft");
setupTouch("btn-right", "ArrowRight");

var brakeBtn = document.getElementById("btn-brake");
brakeBtn.addEventListener("pointerdown", function(e) { e.preventDefault(); player.isBraking = true; brakeBtn.classList.add("active"); });
brakeBtn.addEventListener("pointerup", function(e) { e.preventDefault(); player.isBraking = false; brakeBtn.classList.remove("active"); });
brakeBtn.addEventListener("pointerleave", function() { player.isBraking = false; brakeBtn.classList.remove("active"); });

var nitroBtn = document.getElementById("btn-nitro");
nitroBtn.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    if (player.nitro > 5) { player.isNitro = true; nitroBtn.classList.add("active"); }
});
nitroBtn.addEventListener("pointerup", function(e) { e.preventDefault(); player.isNitro = false; nitroBtn.classList.remove("active"); });
nitroBtn.addEventListener("pointerleave", function() { player.isNitro = false; nitroBtn.classList.remove("active"); });

function addParticle(x, y, color, size, vy, life) {
    particles.push({x:x, y:y, vx:(Math.random()-0.5)*2.2, vy:vy||Math.random()*3+2, size:size||Math.random()*5+3, color:color, life:life||16});
}

function spawnTraffic() {
    if (gameState !== "playing") return;
    var lanes = [-0.62, -0.22, 0.22, 0.62];
    var lane = lanes[Math.floor(Math.random() * lanes.length)];
    if (Math.abs(lane - player.x) < 0.2 && Math.random() < 0.5) return;

    // 80s 風格障礙車：不同車型
    var types = [
        {color:"#ef4444", speed:48, style:"sedan"},      // 紅色轎車
        {color:"#a855f7", speed:62, style:"sports"},     // 紫色跑車
        {color:"#f97316", speed:52, style:"truck"},      // 橘色小卡
        {color:"#22d3ee", speed:70, style:"sports"},     // 青色跑車
        {color:"#84cc16", speed:40, style:"van"},        // 綠色廂型
        {color:"#eab308", speed:55, style:"sedan"}       // 黃色轎車
    ];
    var type = types[Math.floor(Math.random() * types.length)];
    traffic.push({
        x: lane,
        y: 1050 + Math.random() * 180,
        color: type.color,
        speed: type.speed + (Math.random() * 10 - 5),
        style: type.style
    });
}

function update() {
    if (gameState !== "playing") return;
    frame++;
    var topSpeed = player.maxSpeed;
    if (player.isNitro && player.nitro > 0) {
        topSpeed = player.maxSpeed * 1.42;
        player.nitro = Math.max(0, player.nitro - 0.78);
        if (player.nitro <= 0) player.isNitro = false;
    } else {
        if (player.nitro < 100) player.nitro += 0.18;
    }
    if (keys["KeyW"] || keys["ArrowUp"] || (!player.isBraking && player.speed < 50)) {
        player.speed = Math.min(topSpeed, player.speed + player.accel);
    } else if (player.isBraking) {
        player.speed = Math.max(0, player.speed - player.brake);
    } else {
        player.speed = Math.max(0, player.speed - player.decel);
    }
    var turnSpeed = 0.04 * (0.5 + player.speed / 170);
    if (keys["KeyA"] || keys["ArrowLeft"]) player.x = Math.max(-0.82, player.x - turnSpeed);
    if (keys["KeyD"] || keys["ArrowRight"]) player.x = Math.min(0.82, player.x + turnSpeed);
    distance += player.speed * 0.0115;
    score = Math.floor(distance * 9);
    roadOffset = (roadOffset + player.speed * 0.14) % 80;

    var dpr = window.devicePixelRatio || 1;
    var w = canvas.width / dpr;
    var h = canvas.height / dpr;
    if (player.speed > 28) {
        var pX = w/2 + (player.x * (w * 0.34));
        var pY = h - 54;
        if (player.isNitro) {
            addParticle(pX-13, pY, "#38bdf8", 8, 5.2, 15);
            addParticle(pX+13, pY, "#0ea5e9", 8, 5.2, 15);
            addParticle(pX, pY+2, "#bae6fd", 5, 4, 12);
        } else {
            addParticle(pX-11, pY, "#64748b", 4, 2.8, 13);
            addParticle(pX+11, pY, "#64748b", 4, 2.8, 13);
        }
    }
    for (var i = particles.length-1; i >= 0; i--) {
        var p = particles[i];
        p.y += p.vy; p.x += p.vx; p.life--; p.size *= 0.97;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (var j = traffic.length-1; j >= 0; j--) {
        var car = traffic[j];
        car.y -= (player.speed - car.speed) * 1.38;
        if (car.y < 125 && car.y > -5) {
            if (Math.abs(car.x - player.x) < 0.245) {
                triggerCrash();
                return;
            }
        }
        if (car.y < -180 || car.y > 1300) traffic.splice(j, 1);
    }
    document.getElementById("hudSpeed").textContent = Math.floor(player.speed);
    document.getElementById("hudDist").textContent = Math.floor(distance);
    document.getElementById("nitroBar").style.width = player.nitro + "%";
}

function triggerCrash() {
    gameState = "crash";
    if (distance > best) {
        best = distance;
        try { localStorage.setItem("fieldsense_best", best); } catch(e) {}
    }
    document.getElementById("finalDist").textContent = Math.floor(distance);
    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalBest").textContent = Math.floor(best);
    document.getElementById("bestScore").textContent = "最佳：" + Math.floor(best) + " m";
    document.getElementById("crashOverlay").style.display = "flex";
    document.getElementById("touchUI").style.display = "none";
}

// ===== 繪製 80s 風格車輛 =====
function drawPlayerCar(sx, sy, pW, pH) {
    // 陰影
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.ellipse(sx, sy + pH/2 + 2, pW*0.48, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // 車身漸層
    var carGrad = ctx.createLinearGradient(sx - pW/2, 0, sx + pW/2, 0);
    if (player.isNitro) {
        carGrad.addColorStop(0, "#0ea5e9");
        carGrad.addColorStop(0.5, "#7dd3fc");
        carGrad.addColorStop(1, "#0284c7");
    } else {
        carGrad.addColorStop(0, "#f59e0b");
        carGrad.addColorStop(0.45, "#fef08a");
        carGrad.addColorStop(1, "#d97706");
    }
    ctx.fillStyle = carGrad;

    // 80s 跑車輪廓（前窄後寬 + 斜角）
    ctx.beginPath();
    ctx.moveTo(sx - pW*0.42, sy + pH*0.42);          // 左後
    ctx.lineTo(sx - pW*0.48, sy + pH*0.1);            // 左後上
    ctx.lineTo(sx - pW*0.38, sy - pH*0.15);           // 左腰
    ctx.lineTo(sx - pW*0.22, sy - pH*0.42);           // 左前上
    ctx.lineTo(sx + pW*0.22, sy - pH*0.42);           // 右前上
    ctx.lineTo(sx + pW*0.38, sy - pH*0.15);           // 右腰
    ctx.lineTo(sx + pW*0.48, sy + pH*0.1);            // 右後上
    ctx.lineTo(sx + pW*0.42, sy + pH*0.42);           // 右後
    ctx.closePath();
    ctx.fill();

    // 車頂 / 座艙
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.moveTo(sx - pW*0.22, sy - pH*0.08);
    ctx.lineTo(sx - pW*0.16, sy - pH*0.32);
    ctx.lineTo(sx + pW*0.16, sy - pH*0.32);
    ctx.lineTo(sx + pW*0.22, sy - pH*0.08);
    ctx.closePath();
    ctx.fill();

    // 擋風玻璃反光
    ctx.fillStyle = "rgba(186,230,253,0.35)";
    ctx.beginPath();
    ctx.moveTo(sx - pW*0.14, sy - pH*0.12);
    ctx.lineTo(sx - pW*0.1, sy - pH*0.28);
    ctx.lineTo(sx + pW*0.02, sy - pH*0.28);
    ctx.lineTo(sx - pW*0.02, sy - pH*0.12);
    ctx.closePath();
    ctx.fill();

    // 頭燈
    ctx.fillStyle = "#fef9c3";
    ctx.shadowColor = "#fef08a";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(sx - pW*0.28, sy - pH*0.28, 5, 3, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(sx + pW*0.28, sy - pH*0.28, 5, 3, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 尾燈
    if (player.isBraking) {
        ctx.fillStyle = "#ff0000";
        ctx.shadowColor = "#ff0000";
        ctx.shadowBlur = 14;
    } else {
        ctx.fillStyle = "#7f1d1d";
        ctx.shadowBlur = 0;
    }
    ctx.fillRect(sx - pW*0.38, sy + pH*0.28, 12, 5);
    ctx.fillRect(sx + pW*0.26, sy + pH*0.28, 12, 5);
    ctx.shadowBlur = 0;

    // 側邊線條（80s 感）
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx - pW*0.4, sy + pH*0.05);
    ctx.lineTo(sx - pW*0.25, sy - pH*0.2);
    ctx.moveTo(sx + pW*0.4, sy + pH*0.05);
    ctx.lineTo(sx + pW*0.25, sy - pH*0.2);
    ctx.stroke();
}

function drawTrafficCar(sx, sy, cw, ch, color, style) {
    // 陰影
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(sx, sy + ch/2 + 1, cw*0.45, 5, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = color;

    if (style === "sports") {
        // 跑車：低矮、前尖
        ctx.beginPath();
        ctx.moveTo(sx - cw*0.4, sy + ch*0.4);
        ctx.lineTo(sx - cw*0.45, sy + ch*0.05);
        ctx.lineTo(sx - cw*0.3, sy - ch*0.25);
        ctx.lineTo(sx - cw*0.15, sy - ch*0.4);
        ctx.lineTo(sx + cw*0.15, sy - ch*0.4);
        ctx.lineTo(sx + cw*0.3, sy - ch*0.25);
        ctx.lineTo(sx + cw*0.45, sy + ch*0.05);
        ctx.lineTo(sx + cw*0.4, sy + ch*0.4);
        ctx.closePath();
        ctx.fill();
    } else if (style === "truck") {
        // 小卡車：車頭 + 貨斗
        ctx.beginPath();
        ctx.roundRect(sx - cw*0.45, sy - ch*0.15, cw*0.5, ch*0.7, 3);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(sx + cw*0.0, sy - ch*0.35, cw*0.42, ch*0.9, 2);
        ctx.fill();
    } else if (style === "van") {
        // 廂型車：方正
        ctx.beginPath();
        ctx.roundRect(sx - cw*0.42, sy - ch*0.4, cw*0.84, ch*0.85, 4);
        ctx.fill();
    } else {
        // 一般轎車
        ctx.beginPath();
        ctx.moveTo(sx - cw*0.42, sy + ch*0.4);
        ctx.lineTo(sx - cw*0.45, sy + ch*0.05);
        ctx.lineTo(sx - cw*0.35, sy - ch*0.2);
        ctx.lineTo(sx - cw*0.2, sy - ch*0.38);
        ctx.lineTo(sx + cw*0.2, sy - ch*0.38);
        ctx.lineTo(sx + cw*0.35, sy - ch*0.2);
        ctx.lineTo(sx + cw*0.45, sy + ch*0.05);
        ctx.lineTo(sx + cw*0.42, sy + ch*0.4);
        ctx.closePath();
        ctx.fill();
    }

    // 車窗
    ctx.fillStyle = "rgba(15,23,42,0.75)";
    if (style === "truck") {
        ctx.beginPath();
        ctx.roundRect(sx - cw*0.38, sy - ch*0.05, cw*0.32, ch*0.35, 2);
        ctx.fill();
    } else if (style === "van") {
        ctx.beginPath();
        ctx.roundRect(sx - cw*0.32, sy - ch*0.28, cw*0.64, ch*0.35, 2);
        ctx.fill();
    } else {
        ctx.beginPath();
        ctx.moveTo(sx - cw*0.22, sy - ch*0.05);
        ctx.lineTo(sx - cw*0.15, sy - ch*0.28);
        ctx.lineTo(sx + cw*0.15, sy - ch*0.28);
        ctx.lineTo(sx + cw*0.22, sy - ch*0.05);
        ctx.closePath();
        ctx.fill();
    }

    // 尾燈
    ctx.fillStyle = "#ef4444";
    ctx.shadowColor = "#ef4444";
    ctx.shadowBlur = 4;
    ctx.fillRect(sx - cw*0.38, sy + ch*0.28, cw*0.18, 3);
    ctx.fillRect(sx + cw*0.2, sy + ch*0.28, cw*0.18, 3);
    ctx.shadowBlur = 0;
}

function draw() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.width / dpr;
    var h = canvas.height / dpr;
    var horizonY = h * 0.36;

    // 天空（80s 粉紫夕陽感）
    var sky = ctx.createLinearGradient(0, 0, 0, horizonY);
    sky.addColorStop(0, "#0f0a1e");
    sky.addColorStop(0.4, "#2e1065");
    sky.addColorStop(0.75, "#7c3aed");
    sky.addColorStop(1, "#f472b6");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, horizonY);

    // 星星
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    for (var i = 0; i < 40; i++) {
        var sx = (i * 97 + frame * 0.012) % w;
        var sy = (i * 53) % (horizonY * 0.7);
        ctx.beginPath();
        ctx.arc(sx, sy, 0.6 + (i % 3) * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }

    // 霓虹太陽
    var sunGlow = ctx.createRadialGradient(w/2, horizonY - 6, 4, w/2, horizonY - 6, 90);
    sunGlow.addColorStop(0, "#fbbf24");
    sunGlow.addColorStop(0.3, "#f472b6");
    sunGlow.addColorStop(0.7, "#a78bfa");
    sunGlow.addColorStop(1, "transparent");
    ctx.fillStyle = sunGlow;
    ctx.beginPath();
    ctx.arc(w/2, horizonY - 6, 90, 0, Math.PI * 2);
    ctx.fill();

    // 地面
    ctx.fillStyle = "#0a1628";
    ctx.fillRect(0, horizonY, w, h - horizonY);

    // 賽道
    var roadTopW = w * 0.16;
    var roadBottomW = w * 0.88;
    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.moveTo(w/2 - roadTopW/2, horizonY);
    ctx.lineTo(w/2 + roadTopW/2, horizonY);
    ctx.lineTo(w/2 + roadBottomW/2, h);
    ctx.lineTo(w/2 - roadBottomW/2, h);
    ctx.fill();

    // 護欄（紅白）
    var curbW = 12;
    var curbFlash = Math.floor(roadOffset / 18) % 2 === 0;
    ctx.fillStyle = curbFlash ? "#ef4444" : "#f8fafc";
    ctx.beginPath();
    ctx.moveTo(w/2 - roadTopW/2 - curbW, horizonY);
    ctx.lineTo(w/2 - roadTopW/2, horizonY);
    ctx.lineTo(w/2 - roadBottomW/2, h);
    ctx.lineTo(w/2 - roadBottomW/2 - curbW*2.6, h);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w/2 + roadTopW/2, horizonY);
    ctx.lineTo(w/2 + roadTopW/2 + curbW, horizonY);
    ctx.lineTo(w/2 + roadBottomW/2 + curbW*2.6, h);
    ctx.lineTo(w/2 + roadBottomW/2, h);
    ctx.fill();

    // 車道線
    ctx.strokeStyle = "rgba(226,232,240,0.85)";
    ctx.lineWidth = 3;
    ctx.setLineDash([22, 22]);
    ctx.lineDashOffset = -roadOffset;
    ctx.beginPath();
    ctx.moveTo(w/2 - roadTopW/5.5, horizonY);
    ctx.lineTo(w/2 - roadBottomW/5.5, h);
    ctx.moveTo(w/2 + roadTopW/5.5, horizonY);
    ctx.lineTo(w/2 + roadBottomW/5.5, h);
    ctx.stroke();
    ctx.setLineDash([]);

    // 中央虛線
    ctx.strokeStyle = "rgba(251,191,36,0.35)";
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 26]);
    ctx.lineDashOffset = -roadOffset * 1.15;
    ctx.beginPath();
    ctx.moveTo(w/2, horizonY);
    ctx.lineTo(w/2, h);
    ctx.stroke();
    ctx.setLineDash([]);

    // NPC 車輛
    traffic.sort(function(a,b){ return b.y - a.y; });
    for (var t = 0; t < traffic.length; t++) {
        var car = traffic[t];
        var scale = 0.13 + (1000 - car.y) / 1000 * 0.87;
        if (scale < 0.09 || scale > 1.12) continue;
        var sx = w/2 + (car.x * (roadBottomW * 0.4) * scale);
        var sy = horizonY + (1000 - car.y) * ((h - horizonY) / 1000);
        var cw = 68 * scale;
        var ch = 38 * scale;
        drawTrafficCar(sx, sy, cw, ch, car.color, car.style || "sedan");
    }

    // 粒子
    for (var pIdx = 0; pIdx < particles.length; pIdx++) {
        var pt = particles[pIdx];
        ctx.globalAlpha = Math.max(0, pt.life / 16);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, Math.max(0.5, pt.size), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // 玩家車
    var pSX = w/2 + (player.x * (roadBottomW * 0.4));
    var pSY = h - 58;
    drawPlayerCar(pSX, pSY, 74, 44);
}

function gameLoop() {
    update();
    draw();
    if (gameState === "playing") requestAnimationFrame(gameLoop);
}

function resetRun() {
    player.x = 0;
    player.speed = 0;
    player.nitro = 100;
    player.isNitro = false;
    player.isBraking = false;
    traffic = [];
    particles = [];
    distance = 0;
    score = 0;
}

function startGame() {
    document.getElementById("startOverlay").style.display = "none";
    resetRun();
    gameState = "playing";
    document.getElementById("touchUI").style.display = "flex";
    gameLoop();
}

function restartGame() {
    document.getElementById("crashOverlay").style.display = "none";
    resetRun();
    gameState = "playing";
    document.getElementById("touchUI").style.display = "flex";
    gameLoop();
}

document.getElementById("btnStart").addEventListener("click", startGame);
document.getElementById("btnRestart").addEventListener("click", restartGame);

setInterval(function() {
    if (gameState === "playing" && Math.random() < 0.62) spawnTraffic();
}, 1200);

resizeCanvas();
})();
</script>
</body>
</html>
